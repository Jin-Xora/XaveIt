<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Convert files privately in your browser and save them to your device." />
    <title>Save As</title>
  </head>
  <body>
    <main class="save-window" id="save-window">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><i></i></div>
          <h1>Save As</h1>
        </div>
        <button id="close" class="close-button" type="button" aria-label="Close">×</button>
      </header>

      <div class="main-layout">
        <aside class="sidebar" id="sidebar" aria-label="File categories">
          <nav class="folder-nav">
            <button class="folder active" type="button" data-category="documents"><svg viewBox="0 0 24 24"><path d="M6 2.8h8l5 5V21H6z"/><path d="M14 3v5h5M9 13h7M9 16h7"/></svg><span>Documents</span></button>
            <button class="folder" type="button" data-category="pictures"><svg viewBox="0 0 24 24"><rect x="2.5" y="3" width="19" height="18" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m3 17 5-5 4 4 3-3 6 6"/></svg><span>Pictures</span></button>
            <button class="folder" type="button" data-category="music"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Music</span></button>
            <button class="folder" type="button" data-category="videos"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="m10 8 6 4-6 4z"/></svg><span>Videos</span></button>
          </nav>
        </aside>

        <section class="content">
          <div class="location-bar">
            <div class="nav-arrows"><button type="button" aria-label="Back" disabled>‹</button><button type="button" aria-label="Forward" disabled>›</button><button type="button" aria-label="Up" disabled>↑</button></div>
            <div class="location"><svg viewBox="0 0 24 24"><path d="M6 2.8h8l5 5V21H6z"/><path d="M14 3v5h5M9 13h7M9 16h7"/></svg><span id="location-label">Documents</span></div>
            <div class="location-actions"><button type="button" aria-label="Refresh" id="refresh">↻</button><button type="button" aria-label="More options">⌄</button></div>
          </div>

          <div class="work-area">
            <section id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Choose or drop a file">
              <div class="file-illustration" aria-hidden="true"><svg viewBox="0 0 64 76"><path d="M12 2h26l18 18v48a6 6 0 0 1-6 6H12a6 6 0 0 1-6-6V8a6 6 0 0 1 6-6Z" fill="url(#file-gradient)"/><path d="M38 2v14a4 4 0 0 0 4 4h14" fill="#1768df"/><defs><linearGradient id="file-gradient" x1="5" y1="2" x2="57" y2="74" gradientUnits="userSpaceOnUse"><stop stop-color="#39b9ef"/><stop offset="1" stop-color="#0756db"/></linearGradient></defs></svg></div>
              <strong>Drag or upload file</strong>
              <p>Drag and drop a file here, or click to <button id="browse" class="text-button" type="button">browse</button></p>
              <button class="upload-button" id="upload-button" type="button"><span>↑</span> Upload file</button>
              <input id="file-input" type="file" hidden />
            </section>
            <div class="selected-file" id="selected-file" hidden>
              <div class="file-chip"><span class="file-chip-icon">▤</span><div><strong id="file-name"></strong><small id="file-details"></small></div></div>
              <button id="remove" class="remove-button" type="button" aria-label="Remove selected file">×</button>
            </div>
          </div>

          <section id="workspace" class="save-options" hidden>
            <div class="field-row">
              <label for="output-name">File name:</label>
              <input id="output-name" type="text" value="Untitled Document.txt" />
            </div>
            <div class="field-row">
              <label for="format">Save as type:</label>
              <select id="format"></select>
            </div>
            <div class="progress-wrap" id="progress-wrap" hidden>
              <div class="progress-label"><span id="progress-label">Preparing…</span><span id="progress-value">0%</span></div>
              <progress id="progress" max="100" value="0"></progress>
            </div>
            <p id="status" class="status" role="status" aria-live="polite"></p>
          </section>
        </section>
      </div>

      <footer class="bottom-bar">
        <button id="toggle-folders" class="folders-toggle" type="button"><span>⌃</span><span id="folders-label">Hide Folders</span></button>
        <div class="bottom-actions">
          <button id="convert" class="save-button" type="button" disabled>Save</button>
          <button id="cancel" class="cancel-button" type="button">Cancel</button>
        </div>
      </footer>
      <p class="privacy-note">Files are processed locally on this device. Nothing is uploaded.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
